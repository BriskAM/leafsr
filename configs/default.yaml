seed: 42
scale: 4

data:
  root: data
  train_lr: train_Low_Resolution
  train_hr: train_High_Resolution
  test_lr: test_Low_Resolution
  sample_submission: sample_submission.csv
  vgg_weights: vgg19_weights.pth
  val_fraction: 0.10

model:
  channels: 64
  growth: 24
  num_rrdb: 4
  discriminator_base: 24

training:
  patch_size: 32
  batch_size: 8
  epochs: 45
  patches_per_image: 16
  warmup_epochs: 10
  early_stopping_patience: 8
  early_stopping_min_delta: 0.0008
  num_workers: 2
  generator_lr: 0.00015
  discriminator_lr: 0.00003
  weight_decay: 0.0001
  ema_decay: 0.999
  ema_every: 1
  top_k: 3
  grad_clip: 1.0

loss:
  pixel: 1.15
  residual: 0.55
  perceptual: 0.012
  fft: 0.008
  adversarial: 0.00005

output:
  dir: runs/leafsr
  checkpoint: best_leafsr.pt
  metrics: metrics.json
